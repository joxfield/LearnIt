name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Budowanie aplikacji
        run: |
          echo "Budowanie aplikacji..."
          echo "Build zakończony!" > build.log
      - name: Zapisz artefakt
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
        if: github.ref == 'refs/heads/main'

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Uruchomienie testów
        run: |
          echo "Uruchamianie testów..."
          echo "Wszystkie testy przeszły!"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Wdrażanie na produkcję
        run: echo "Wdrażanie na produkcję..."
      - name: Raport statusu
        run: echo "Wdrożenie zakończone sukcesem!"
